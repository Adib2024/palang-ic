<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Privacy guarantee enforced by the browser: this page cannot open any
       network connection, and loads code, styles, fonts and images only
       from this site. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'none'; font-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Banding PDF · DokuJaga</title>
  <meta name="description" content="Bandingkan dua versi PDF terus dalam pelayar: teks dan visual. Tiada apa-apa dimuat naik.">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../icons/icon-192.png">
  <link rel="preload" href="../fonts/inter-regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/theme.js"></script>
  <script type="module" src="../js/compare.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="logo" href="../"><img src="../icons/icon.svg" alt="" width="30" height="30"><span>DokuJaga</span></a>
      <nav class="nav-links" aria-label="Utama">
        <a href="../#tools" data-i18n="navTools">Alat</a>
        <a href="../#privacy" data-i18n="navPrivacy">Privasi</a>
      </nav>
      <div class="top-actions">
        <a class="adv-link" href="../aliran-kerja/" data-i18n-attr="title:navAdvanced" title="Mod Lanjutan"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="6" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="14" y="15" width="7" height="6" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M6.5 9v3.5a2 2 0 0 0 2 2H14m-2.5-2.5L14 14.5 11.5 17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M17.5 5h2.5M17.5 8h2.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span data-i18n="navAdvanced">Mod Lanjutan</span></a>
        <button type="button" class="theme-toggle" id="themeToggle" aria-pressed="false"
                data-i18n-attr="aria-label:themeToggle,title:themeToggle" aria-label="Tukar tema cerah/gelap">&#9790;</button>
        <div class="lang" role="group" aria-label="Bahasa / Language">
          <button type="button" data-lang="ms" aria-pressed="true">BM</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </div>
  </header>

  <section class="hero tool-hero tone-violet">
    <div class="container">
      <p class="crumbs"><a href="../" data-i18n="allTools">Semua alat</a> /</p>
      <span class="tool-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="2.5" y="3" width="8" height="15" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="13.5" y="6" width="8" height="15" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M5 7.5h3.5M5 10.5h3.5M16 10.5h3.5M16 13.5h3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M5 13.5h3.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" opacity=".55"/><path d="M16 16.5h3.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" opacity=".55"/></svg></span>
      <h1 data-i18n="toolCompareTitle">Banding PDF</h1>
      <p class="lead" data-i18n="difLead"></p>
    </div>
  </section>

  <main class="page">
    <div class="container stack">
      <section class="privacy">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5l-8-3Zm-1 14-4-4 1.4-1.4L11 13.2l4.6-4.6L17 10l-6 6Z"/></svg>
        <strong data-i18n="privacyFiles">Fail anda diproses dalam peranti anda sahaja. Tiada apa-apa dimuat naik.</strong>
      </section>

      <section class="card tone-violet" aria-labelledby="cmpFiles">
        <h2 id="cmpFiles" class="sr-title" data-i18n="toolCompareTitle">Banding PDF</h2>
        <div class="cmp-slots">
          <label class="cmp-slot old" id="slotA">
            <input type="file" id="fileA" accept="application/pdf,.pdf">
            <span class="cmp-tag">A</span>
            <strong data-i18n="difOld"></strong>
            <span class="cmp-name"></span>
            <span class="cmp-meta"></span>
            <span class="cmp-pick" data-i18n="difPick">Pilih PDF</span>
          </label>
          <button type="button" class="icon-btn cmp-swap" id="swap" data-i18n-attr="aria-label:difSwap,title:difSwap" aria-label="Tukar A dan B">⇄</button>
          <label class="cmp-slot new" id="slotB">
            <input type="file" id="fileB" accept="application/pdf,.pdf">
            <span class="cmp-tag">B</span>
            <strong data-i18n="difNew"></strong>
            <span class="cmp-name"></span>
            <span class="cmp-meta"></span>
            <span class="cmp-pick" data-i18n="difPick">Pilih PDF</span>
          </label>
        </div>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </section>

      <section class="card tone-violet" id="results" aria-labelledby="resTitle" hidden>
        <div class="cmp-head">
          <h2 id="resTitle" data-i18n="difResults">Perbezaan</h2>
          <ul class="cmp-summary">
            <li class="ins" id="sumIns"></li>
            <li class="del" id="sumDel"></li>
            <li id="sumPages"></li>
          </ul>
        </div>
        <fieldset class="segmented small cmp-tabs">
          <legend class="sr-title" data-i18n="difResults">Perbezaan</legend>
          <label><input type="radio" name="cmpTab" value="text" checked><span data-i18n="difTabText">Teks</span></label>
          <label><input type="radio" name="cmpTab" value="visual"><span data-i18n="difTabVisual">Visual</span></label>
        </fieldset>
        <div class="cmp-text" id="diffText"></div>
        <div id="visualPanel" hidden>
          <label class="check"><input type="checkbox" id="onlyChanged" checked><span data-i18n="difOnlyChanged">Tunjuk muka surat yang berbeza sahaja</span></label>
          <p class="hint" data-i18n="difVisualHint"></p>
          <div class="cmp-visual" id="diffVisual"></div>
        </div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div>
        <a class="logo" href="../"><img src="../icons/icon.svg" alt="" width="24" height="24"><span>DokuJaga</span></a>
        <p data-i18n="footerTag">Alat dokumen yang jaga privasi anda.</p>
      </div>
      <p data-i18n="footer">Bukan laman rasmi kerajaan. Sumber terbuka (MIT).</p>
    </div>
  </footer>
</body>
</html>
