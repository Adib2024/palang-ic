<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Privacy guarantee enforced by the browser: this page cannot open any
       network connection, and loads code, styles, fonts and images only
       from this site. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'none'; font-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>OCR PDF · DokuJaga</title>
  <meta name="description" content="Jadikan PDF imbasan boleh dicari dan disalin (Bahasa Melayu & Inggeris) terus dalam pelayar. Tiada apa-apa dimuat naik.">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../icons/icon-192.png">
  <link rel="preload" href="../fonts/inter-regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/theme.js"></script>
  <script type="module" src="../js/ocr.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="logo" href="../"><img src="../icons/icon.svg" alt="" width="30" height="30"><span>DokuJaga</span></a>
      <nav class="nav-links" aria-label="Utama">
        <a href="../#tools" data-i18n="navTools">Alat</a>
        <a href="../#privacy" data-i18n="navPrivacy">Privasi</a>
      </nav>
      <div class="top-actions">
        <a class="adv-link" href="../aliran-kerja/" data-i18n-attr="title:navAdvanced" title="Mod Lanjutan"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="6" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="14" y="15" width="7" height="6" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M6.5 9v3.5a2 2 0 0 0 2 2H14m-2.5-2.5L14 14.5 11.5 17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M17.5 5h2.5M17.5 8h2.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span data-i18n="navAdvanced">Mod Lanjutan</span></a>
        <button type="button" class="theme-toggle" id="themeToggle" aria-pressed="false"
                data-i18n-attr="aria-label:themeToggle,title:themeToggle" aria-label="Tukar tema cerah/gelap">&#9790;</button>
        <div class="lang" role="group" aria-label="Bahasa / Language">
          <button type="button" data-lang="ms" aria-pressed="true">BM</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </div>
  </header>

  <section class="hero tool-hero tone-emerald">
    <div class="container">
      <p class="crumbs"><a href="../" data-i18n="allTools">Semua alat</a> /</p>
      <span class="tool-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M7.5 15.5 10 8.5l2.5 7M8.4 13h3.2M14.5 8.5v7h1.8a1.8 1.8 0 0 0 0-3.6H14.5h1.5a1.7 1.7 0 0 0 0-3.4h-1.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <h1 data-i18n="toolOcrTitle">OCR PDF</h1>
      <p class="lead" data-i18n="ocrLead"></p>
    </div>
  </section>

  <main class="page">
    <div class="container stack">
      <section class="privacy">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5l-8-3Zm-1 14-4-4 1.4-1.4L11 13.2l4.6-4.6L17 10l-6 6Z"/></svg>
        <strong data-i18n="privacyFiles">Fail anda diproses dalam peranti anda sahaja. Tiada apa-apa dimuat naik.</strong>
      </section>

      <div class="tool-layout tone-emerald is-empty" id="toolLayout">
        <section class="card" aria-labelledby="docTitle">
          <div class="dropzone" id="dropzone">
            <svg aria-hidden="true" viewBox="0 0 24 24" width="44" height="44"><path d="M12 15.5V4m-4.5 4.5L12 4l4.5 4.5M4 15v3.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <p><strong data-i18n="ocrDrop"></strong></p>
            <p class="drop-or" data-i18n="i2pOr">atau</p>
            <div class="drop-buttons">
              <label class="btn primary lg">
                <input type="file" id="pickFiles" accept="application/pdf,.pdf,image/*" multiple>
                <span data-i18n="ocrChoose"></span>
              </label>
            </div>
          </div>
          <div class="file-card after-load">
            <div class="file-info">
              <h2 id="docTitle" class="file-name"></h2>
              <p class="file-meta" id="docMeta"></p>
              <button type="button" class="link" id="another" data-i18n="cmpAnother">Pilih PDF lain</button>
            </div>
          </div>
          <div class="after-load ocr-result" id="result" hidden>
            <p class="note ok-note" id="resultMeta"></p>
            <div class="buttons">
              <button type="button" class="primary" id="savePdf" data-i18n="ocrSavePdf">Simpan PDF boleh cari</button>
              <button type="button" id="sharePdf" data-i18n="pdfShare">Kongsi</button>
            </div>
            <label class="field">
              <span data-i18n="ocrTextLabel">Teks dikenal pasti</span>
              <textarea id="ocrText" rows="12" readonly spellcheck="false"></textarea>
            </label>
            <div class="buttons">
              <button type="button" id="copyText" data-i18n="ocrCopy">Salin teks</button>
              <button type="button" id="saveTxt" data-i18n="ocrSaveTxt">Muat turun .txt</button>
            </div>
          </div>
        </section>

        <aside class="card options" aria-labelledby="optTitle">
          <h2 id="optTitle" data-i18n="toolOcrTitle">OCR PDF</h2>
          <fieldset class="ocr-langs">
            <legend data-i18n="ocrLangs">Bahasa dokumen</legend>
            <label class="check"><input type="checkbox" id="langMs" checked><span>Bahasa Melayu</span></label>
            <label class="check"><input type="checkbox" id="langEn" checked><span>English</span></label>
          </fieldset>
          <label class="check"><input type="checkbox" id="skipText" checked><span data-i18n="ocrSkipText">Langkau muka surat yang sudah ada teks</span></label>
          <label class="field">
            <span data-i18n="i2pFileName">Nama fail</span>
            <input type="text" id="fileName" maxlength="60" autocomplete="off">
          </label>
          <div class="buttons stack">
            <button type="button" class="primary" id="runOcr" data-i18n="ocrRun">Mula OCR</button>
          </div>
          <div class="progress" id="progress" hidden><span id="progressBar"></span></div>
          <p class="status" id="status" role="status" aria-live="polite"></p>
          <p class="hint" data-i18n="ocrNote"></p>
        </aside>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div>
        <a class="logo" href="../"><img src="../icons/icon.svg" alt="" width="24" height="24"><span>DokuJaga</span></a>
        <p data-i18n="footerTag">Alat dokumen yang jaga privasi anda.</p>
      </div>
      <p data-i18n="footer">Bukan laman rasmi kerajaan. Sumber terbuka (MIT).</p>
    </div>
  </footer>
</body>
</html>
