name: Test and deploy

# Tests run on every push and pull request. The site is deployed only from
# main, and only when every test suite passes.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pinned: Playwright 1.56 has no Chromium build for newer Ubuntu images.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test tools (Playwright + Chromium, pypdf)
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
          pip install --quiet 'pypdf>=5' cryptography python-docx openpyxl python-pptx
      - name: Run all test suites
        env:
          NODE_PATH: /tmp/pw/node_modules
        run: tests/run-all.sh "$RUNNER_TEMP/test-output"
      - name: Keep screenshots and outputs if a test failed
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-output
          path: ${{ runner.temp }}/test-output
          retention-days: 7

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      # Publish only the static app, not tests or fixtures.
      - name: Stage site
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js css js icons vendor palang gambar-pdf susun-pdf kecilkan-pdf pdf-gambar kecil-gambar tandatangan-pdf imbas gabung-pdf pisah-pdf putar-pdf watermark-pdf nombor-pdf potong-pdf edit-pdf hitamkan-pdf isi-borang buka-kunci-pdf lindungi-pdf aliran-kerja banding-pdf ocr-pdf kongsi pdf-word pdf-excel pdf-powerpoint _site/
          touch _site/.nojekyll
      # Self-host Inter (SIL OFL 1.1): subset to Latin + punctuation and
      # convert to WOFF2 so the site never loads fonts from another host.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build web fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-inter
          pip install --quiet fonttools brotli
          mkdir -p _site/fonts
          for w in Regular Medium SemiBold Bold ExtraBold; do
            src=$(fc-list --format '%{file}\n' | grep -E "/Inter-$w\.(otf|ttf)$" | head -n1)
            test -n "$src" || { echo "Inter-$w not found"; exit 1; }
            pyftsubset "$src" --flavor=woff2 \
              --unicodes='U+0000-00FF,U+0131,U+0152-0153,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2190-2199,U+2212,U+2215,U+25A0-25FF,U+2600-26FF' \
              --layout-features='kern,liga,calt,tnum,case' \
              --output-file="_site/fonts/inter-$(echo "$w" | tr '[:upper:]' '[:lower:]').woff2"
          done
          cp /usr/share/doc/fonts-inter/copyright _site/fonts/LICENSE-Inter.txt
          ls -la _site/fonts
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
