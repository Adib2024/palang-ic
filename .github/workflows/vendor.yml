name: Vendor PDF libraries

# Run manually to (re)fetch the third-party libraries (PDF + OCR) into vendor/
# and commit them, so the site serves them itself and never loads code or
# OCR models from a CDN.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pinned versions
        run: |
          mkdir -p /tmp/v && cd /tmp/v
          npm init -y >/dev/null
          npm install --no-audit --no-fund --ignore-scripts pdf-lib@1.17.1 pdfjs-dist@4.10.38 tesseract.js@5.1.1 tesseract.js-core@5.1.1 @pdf-lib/fontkit@1.1.1
          # OCR language models (Malay + English); optional packages, see fallback below.
          npm install --no-audit --no-fund --ignore-scripts @tesseract.js-data/eng@1.0.0 @tesseract.js-data/msa@1.0.0 || true
      - name: Copy into vendor/
        run: |
          rm -rf vendor && mkdir -p vendor/pdf-lib vendor/pdfjs
          cp /tmp/v/node_modules/pdf-lib/dist/pdf-lib.esm.min.js vendor/pdf-lib/
          cp /tmp/v/node_modules/pdf-lib/LICENSE.md vendor/pdf-lib/LICENSE.md
          cp /tmp/v/node_modules/pdfjs-dist/legacy/build/pdf.min.mjs vendor/pdfjs/
          cp /tmp/v/node_modules/pdfjs-dist/legacy/build/pdf.worker.min.mjs vendor/pdfjs/
          cp -r /tmp/v/node_modules/pdfjs-dist/standard_fonts vendor/pdfjs/standard_fonts
          cp -r /tmp/v/node_modules/pdfjs-dist/cmaps vendor/pdfjs/cmaps
          cp /tmp/v/node_modules/pdfjs-dist/LICENSE vendor/pdfjs/LICENSE
          # OCR: tesseract.js (main + worker), its WebAssembly core, and models.
          mkdir -p vendor/tesseract/core vendor/tesseract/lang
          cp /tmp/v/node_modules/tesseract.js/dist/tesseract.min.js vendor/tesseract/
          cp /tmp/v/node_modules/tesseract.js/dist/worker.min.js vendor/tesseract/
          cp /tmp/v/node_modules/tesseract.js/LICENSE.md vendor/tesseract/LICENSE.md 2>/dev/null || cp /tmp/v/node_modules/tesseract.js/LICENSE* vendor/tesseract/
          cp /tmp/v/node_modules/tesseract.js-core/tesseract-core*.wasm.js vendor/tesseract/core/
          cp /tmp/v/node_modules/tesseract.js-core/tesseract-core*.wasm vendor/tesseract/core/ 2>/dev/null || true
          for l in eng msa; do
            f=$(ls /tmp/v/node_modules/@tesseract.js-data/$l/4.0.0_best_int/$l.traineddata.gz 2>/dev/null || true)
            if [ -n "$f" ]; then
              cp "$f" vendor/tesseract/lang/
            else
              curl -fsSL "https://github.com/tesseract-ocr/tessdata_fast/raw/main/$l.traineddata" -o /tmp/$l.traineddata
              gzip -9 -c /tmp/$l.traineddata > vendor/tesseract/lang/$l.traineddata.gz
            fi
          done
          ls -la vendor/tesseract vendor/tesseract/core vendor/tesseract/lang
          # Custom fonts in PDFs: fontkit for pdf-lib.
          mkdir -p vendor/fontkit
          cp /tmp/v/node_modules/@pdf-lib/fontkit/dist/fontkit.umd.min.js vendor/fontkit/
          cp /tmp/v/node_modules/@pdf-lib/fontkit/LICENSE* vendor/fontkit/ 2>/dev/null || true
      - name: Build fonts (Google Fonts, OFL/Apache; static Regular/Bold, Latin subset)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install --quiet fonttools==4.53.1
          python3 tools/build-fonts.py vendor/fonts
          du -sh vendor/fonts
          {
            echo "Vendored by .github/workflows/vendor.yml — do not edit by hand."
            echo
            for p in pdf-lib pdfjs-dist tesseract.js tesseract.js-core @pdf-lib/fontkit; do
              node -e "const l=require('/tmp/v/package-lock.json').packages['node_modules/$p']; console.log('$p', l.version, l.integrity, l.license||'')"
            done
          } > vendor/VERSIONS.txt
          cat vendor/VERSIONS.txt
          du -sh vendor/*
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Vendor pdf-lib, pdf.js, tesseract.js (eng+msa), fontkit and fonts"
          git push origin HEAD:${GITHUB_REF_NAME}
