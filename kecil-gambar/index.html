<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Privacy guarantee enforced by the browser: this page cannot open any
       network connection, and loads code, styles, fonts and images only
       from this site. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'none'; font-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Kecilkan Gambar · DokuJaga</title>
  <meta name="description" content="Kecilkan saiz dan dimensi gambar, dan buang data EXIF, terus dalam pelayar. Tiada apa-apa dimuat naik.">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../icons/icon-192.png">
  <link rel="preload" href="../fonts/inter-regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/theme.js"></script>
  <script type="module" src="../js/imgsmall.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="logo" href="../"><img src="../icons/icon.svg" alt="" width="30" height="30"><span>DokuJaga</span></a>
      <nav class="nav-links" aria-label="Utama">
        <a href="../#tools" data-i18n="navTools">Alat</a>
        <a href="../#privacy" data-i18n="navPrivacy">Privasi</a>
      </nav>
      <div class="top-actions">
        <button type="button" class="theme-toggle" id="themeToggle" aria-pressed="false"
                data-i18n-attr="aria-label:themeToggle,title:themeToggle" aria-label="Tukar tema cerah/gelap">&#9790;</button>
        <div class="lang" role="group" aria-label="Bahasa / Language">
          <button type="button" data-lang="ms" aria-pressed="true">BM</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </div>
  </header>

  <section class="hero tool-hero tone-teal">
    <div class="container">
      <p class="crumbs"><a href="../" data-i18n="allTools">Semua alat</a> /</p>
      <span class="tool-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M14 4v6h6M10 20v-6H4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="m14 10 5.5-5.5M10 14l-5.5 5.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></span>
      <h1 data-i18n="toolImgSmallTitle">Kecilkan Gambar</h1>
      <p class="lead" data-i18n="isLead"></p>
    </div>
  </section>

  <main class="page">
    <div class="container stack">
      <section class="privacy">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5l-8-3Zm-1 14-4-4 1.4-1.4L11 13.2l4.6-4.6L17 10l-6 6Z"/></svg>
        <strong data-i18n="privacyFiles">Fail anda diproses dalam peranti anda sahaja. Tiada apa-apa dimuat naik.</strong>
      </section>

      <div class="tool-layout tone-teal is-empty" id="toolLayout">
        <section class="card" aria-labelledby="listTitle">
          <div class="dropzone" id="dropzone">
            <svg aria-hidden="true" viewBox="0 0 24 24" width="44" height="44"><path d="M12 15.5V4m-4.5 4.5L12 4l4.5 4.5M4 15v3.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <p><strong data-i18n="isDropBig"></strong></p>
            <p class="drop-or" data-i18n="i2pOr">atau</p>
            <div class="drop-buttons">
              <label class="btn primary lg">
                <input type="file" id="pickFiles" accept="image/*" multiple>
                <span data-i18n="i2pChoose"></span>
              </label>
              <label class="btn lg camera-only">
                <input type="file" id="pickCamera" accept="image/*" capture="environment">
                <span data-i18n="i2pCamera">Ambil gambar</span>
              </label>
            </div>
          </div>

          <div class="pages-head">
            <h2 id="listTitle"><span data-i18n="i2pPages">Gambar</span><span class="count" id="count">0</span></h2>
            <button type="button" class="link" id="clearAll" data-i18n="i2pClear">Buang semua</button>
          </div>
          <ul class="img-list" id="imgList"></ul>
        </section>

        <aside class="card options" aria-labelledby="optTitle">
          <h2 id="optTitle" data-i18n="i2pOptions">Tetapan</h2>
          <label class="field">
            <span data-i18n="isMaxSize">Saiz fail maksimum</span>
            <select id="limit">
              <option value="0" data-i18n="cmpNoLimit">Tiada had</option>
              <option value="1048576">1 MB</option>
              <option value="512000">500 KB</option>
              <option value="204800">200 KB</option>
              <option value="102400">100 KB</option>
            </select>
          </label>
          <label class="field">
            <span data-i18n="isMaxDim">Lebar / tinggi maksimum</span>
            <select id="maxDim">
              <option value="0" data-i18n="isOriginal">Saiz asal</option>
              <option value="2560">2560 px</option>
              <option value="1920">1920 px</option>
              <option value="1280">1280 px</option>
              <option value="800">800 px</option>
            </select>
          </label>
          <fieldset class="segmented small">
            <legend data-i18n="p2iFormat">Format</legend>
            <label><input type="radio" name="format" value="jpeg" checked><span>JPG</span></label>
            <label><input type="radio" name="format" value="png"><span>PNG</span></label>
          </fieldset>
          <p class="hint" id="pngNote" hidden data-i18n="isPngNote"></p>
          <p class="note ok-note" data-i18n="isExif"></p>
          <div class="buttons stack">
            <button type="button" class="primary" id="run" data-i18n="isRun">Kecilkan gambar</button>
            <button type="button" id="saveAll" data-i18n="isSaveAll" disabled>Simpan semua</button>
            <button type="button" id="shareAll" data-i18n="pdfShare" disabled>Kongsi</button>
          </div>
          <div class="progress" id="progress" hidden><span id="progressBar"></span></div>
          <p class="status" id="status" role="status" aria-live="polite"></p>
        </aside>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div>
        <a class="logo" href="../"><img src="../icons/icon.svg" alt="" width="24" height="24"><span>DokuJaga</span></a>
        <p data-i18n="footerTag">Alat dokumen yang jaga privasi anda.</p>
      </div>
      <p data-i18n="footer">Bukan laman rasmi kerajaan. Sumber terbuka (MIT).</p>
    </div>
  </footer>
</body>
</html>
