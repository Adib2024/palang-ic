<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Privacy guarantee enforced by the browser: this page cannot open any
       network connection, and loads code, styles, fonts and images only
       from this site. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'none'; font-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Image Notes · DokuJaga</title>
  <meta name="description" content="Tulis nota, anak panah, kotak dan sorotan pada gambar slip gaji, bil atau resit, kemudian simpan sebagai JPG. Tiada apa-apa dimuat naik.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="DokuJaga">
  <meta property="og:title" content="Image Notes · DokuJaga">
  <meta property="og:description" content="Tulis nota, anak panah, kotak dan sorotan pada gambar slip gaji, bil atau resit, kemudian simpan sebagai JPG. Tiada apa-apa dimuat naik.">
  <meta property="og:image" content="https://adib2024.github.io/palang-ic/icons/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../icons/icon-192.png">
  <link rel="preload" href="../fonts/inter-regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/theme.js"></script>
  <script type="module" src="../js/imgnote.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="logo" href="../"><img src="../icons/icon.svg" alt="" width="30" height="30"><span>DokuJaga</span></a>
      <nav class="nav-links" aria-label="Main">
        <a href="../#tools" data-i18n="navTools">Tools</a>
        <a href="../#privacy" data-i18n="navPrivacy">Privacy</a>
      </nav>
      <div class="top-actions">
        <a class="adv-link" href="../aliran-kerja/" data-i18n-attr="title:navAdvanced" title="Advanced mode"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="6" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="14" y="15" width="7" height="6" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M6.5 9v3.5a2 2 0 0 0 2 2H14m-2.5-2.5L14 14.5 11.5 17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M17.5 5h2.5M17.5 8h2.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span data-i18n="navAdvanced">Advanced mode</span></a>
        <button type="button" class="theme-toggle" id="themeToggle" aria-pressed="false"
                data-i18n-attr="aria-label:themeToggle,title:themeToggle" aria-label="Switch light/dark theme">&#9790;</button>
        <div class="lang" role="group" aria-label="Bahasa / Language">
          <button type="button" data-lang="en" aria-pressed="true">EN</button>
          <button type="button" data-lang="ms" aria-pressed="false">BM</button>
        </div>
      </div>
    </div>
  </header>

  <section class="hero tool-hero tone-sky">
    <div class="container">
      <p class="crumbs"><a href="../" data-i18n="allTools">All tools</a> /</p>
      <span class="tool-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="2.5" y="4" width="15" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M5.5 8h6M5.5 11h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="m14.5 19.5 1-3.5 5.5-5.5 2.5 2.5-5.5 5.5Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></span>
      <h1 data-i18n="toolNoteTitle">Image Notes</h1>
      <p class="lead" data-i18n="ntLead"></p>
    </div>
  </section>

  <main class="page">
    <div class="container stack">
      <section class="privacy">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5l-8-3Zm-1 14-4-4 1.4-1.4L11 13.2l4.6-4.6L17 10l-6 6Z"/></svg>
        <strong data-i18n="privacyFiles">Your files are processed on your device only. Nothing is uploaded.</strong>
      </section>

      <div class="tool-layout tone-sky is-empty" id="toolLayout">
        <section class="card" aria-labelledby="docTitle">
          <div class="dropzone" id="dropzone">
            <svg aria-hidden="true" viewBox="0 0 24 24" width="44" height="44"><path d="M12 15.5V4m-4.5 4.5L12 4l4.5 4.5M4 15v3.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <p><strong data-i18n="ntDropBig"></strong></p>
            <p class="drop-or" data-i18n="i2pOr">or</p>
            <div class="drop-buttons">
              <label class="btn primary lg">
                <input type="file" id="pickFiles" accept="image/*,.heic,.heif">
                <span data-i18n="ntChoose"></span>
              </label>
              <label class="btn lg camera-only">
                <input type="file" id="pickCamera" accept="image/*" capture="environment">
                <span data-i18n="i2pCamera">Take photo</span>
              </label>
            </div>
          </div>
          <div class="file-card after-load">
            <div class="file-info">
              <h2 id="docTitle" class="file-name"></h2>
              <p class="file-meta" id="docMeta"></p>
              <button type="button" class="link" id="another" data-i18n="ntAnother"></button>
            </div>
          </div>
          <div class="nt-stage after-load">
            <canvas id="ntCanvas" width="800" height="600" tabindex="0" data-i18n-attr="aria-label:ntCanvasLabel"></canvas>
            <p class="hint" id="ntHint" data-i18n="ntHint"></p>
          </div>
        </section>
        <aside class="card options" aria-labelledby="optTitle">
          <h2 id="optTitle" data-i18n="optSettings">Settings</h2>
          <fieldset class="segmented small">
            <legend data-i18n="ntTool">Add</legend>
            <label><input type="radio" name="ntTool" value="text" checked><span data-i18n="ntToolText">Text</span></label>
            <label><input type="radio" name="ntTool" value="arrow"><span data-i18n="ntToolArrow">Arrow</span></label>
            <label><input type="radio" name="ntTool" value="box"><span data-i18n="ntToolBox">Box</span></label>
            <label><input type="radio" name="ntTool" value="mark"><span data-i18n="ntToolMark">Highlight</span></label>
          </fieldset>
          <label class="field" id="ntTextRow"><span data-i18n="ntText">Note text</span><input type="text" id="ntText" maxlength="80" autocomplete="off"></label>
          <fieldset class="swatches">
            <legend data-i18n="color">Colour</legend>
            <label class="sw sw-red"><input type="radio" name="ntColor" value="red" checked><span data-i18n="red">Red</span></label>
            <label class="sw sw-blue"><input type="radio" name="ntColor" value="blue"><span data-i18n="blue">Blue</span></label>
            <label class="sw sw-green"><input type="radio" name="ntColor" value="green"><span data-i18n="ntGreen">Green</span></label>
            <label class="sw sw-black"><input type="radio" name="ntColor" value="black"><span data-i18n="black">Black</span></label>
            <label class="sw sw-yellow"><input type="radio" name="ntColor" value="yellow"><span data-i18n="ntYellow">Yellow</span></label>
          </fieldset>
          <fieldset class="segmented small">
            <legend data-i18n="ntSize">Size</legend>
            <label><input type="radio" name="ntSize" value="s"><span data-i18n="ntSizeS">Small</span></label>
            <label><input type="radio" name="ntSize" value="m" checked><span data-i18n="ntSizeM">Medium</span></label>
            <label><input type="radio" name="ntSize" value="l"><span data-i18n="ntSizeL">Large</span></label>
          </fieldset>
          <label class="check" id="ntBgRow"><input type="checkbox" id="ntBg" checked><span data-i18n="ntBg">White background behind text</span></label>
          <div class="nt-actions">
            <button type="button" class="btn small" id="ntAddCenter" data-i18n="ntAddCenter"></button>
            <button type="button" class="btn small" id="ntDelete" data-i18n="ntDelete"></button>
          </div>
          <p class="hint" id="ntCount"></p>
          <button type="button" class="link" id="ntClear" data-i18n="ntClear"></button>
            <div class="buttons">
              <button type="button" class="primary" id="saveNote" data-i18n="ntSave"></button>
              <button type="button" id="shareNote" data-i18n="ntShare"></button>
            </div>
            <p class="status" id="status" role="status" aria-live="polite"></p>
        </aside>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div>
        <a class="logo" href="../"><img src="../icons/icon.svg" alt="" width="24" height="24"><span>DokuJaga</span></a>
        <p data-i18n="footerTag">Document tools that keep your files private.</p>
      </div>
      <p class="footer-links"><a href="../privasi/" data-i18n="privacyPage">Privacy</a><a href="https://github.com/Adib2024/palang-ic" rel="noopener">GitHub</a></p>
      <p data-i18n="footer">Not an official government site. Open source (MIT).</p>
    </div>
  </footer>
</body>
</html>
