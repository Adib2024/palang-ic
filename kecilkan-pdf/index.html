<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Privacy guarantee enforced by the browser: this page cannot open any
       network connection, and loads code, styles, fonts and images only
       from this site. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'none'; font-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Kecilkan PDF · DokuJaga</title>
  <meta name="description" content="Kecilkan saiz PDF terus dalam pelayar untuk had muat naik portal. Tiada apa-apa dimuat naik.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0d17" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../icons/icon-192.png">
  <link rel="preload" href="../fonts/inter-regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/theme.js"></script>
  <script type="module" src="../js/compress.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="logo" href="../"><img src="../icons/icon.svg" alt="" width="30" height="30"><span>DokuJaga</span></a>
      <nav class="nav-links" aria-label="Utama">
        <a href="../#tools" data-i18n="navTools">Alat</a>
        <a href="../#privacy" data-i18n="navPrivacy">Privasi</a>
      </nav>
      <div class="top-actions">
        <button type="button" class="theme-toggle" id="themeToggle" aria-pressed="false"
                data-i18n-attr="aria-label:themeToggle,title:themeToggle" aria-label="Tukar tema cerah/gelap">&#9790;</button>
        <div class="lang" role="group" aria-label="Bahasa / Language">
          <button type="button" data-lang="ms" aria-pressed="true">BM</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </div>
  </header>

  <section class="hero tool-hero tone-emerald">
    <div class="container">
      <p class="crumbs"><a href="../" data-i18n="allTools">Semua alat</a> /</p>
      <span class="tool-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M12 7.5v4m-2-2 2 2 2-2M12 18v-4m-2 2 2-2 2 2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <h1 data-i18n="toolCompressTitle">Kecilkan PDF</h1>
      <p class="lead" data-i18n="cmpLead"></p>
    </div>
  </section>

  <main class="page">
    <div class="container stack">
      <section class="privacy">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5l-8-3Zm-1 14-4-4 1.4-1.4L11 13.2l4.6-4.6L17 10l-6 6Z"/></svg>
        <strong data-i18n="privacyFiles">Fail anda diproses dalam peranti anda sahaja. Tiada apa-apa dimuat naik.</strong>
      </section>

      <div class="tool-layout tone-emerald is-empty" id="toolLayout">
        <section class="card" aria-labelledby="fileTitle">
          <div class="dropzone" id="dropzone">
            <svg aria-hidden="true" viewBox="0 0 24 24" width="44" height="44"><path d="M12 15.5V4m-4.5 4.5L12 4l4.5 4.5M4 15v3.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <p><strong data-i18n="pdfDropBig">Seret fail PDF ke sini</strong></p>
            <p class="drop-or" data-i18n="i2pOr">atau</p>
            <div class="drop-buttons">
              <label class="btn primary lg">
                <input type="file" id="pickFiles" accept="application/pdf,.pdf">
                <span data-i18n="pdfChoose">Pilih PDF</span>
              </label>
            </div>
          </div>

          <div class="file-card" id="fileCard" hidden>
            <div class="file-thumb" id="fileThumb"></div>
            <div class="file-info">
              <h2 id="fileTitle" class="file-name"></h2>
              <p class="file-meta" id="fileMeta"></p>
              <button type="button" class="link" id="another" data-i18n="cmpAnother">Pilih PDF lain</button>
            </div>
          </div>

          <div class="result" id="result" hidden>
            <div class="result-sizes">
              <div><span class="result-label" data-i18n="cmpOriginal">Saiz asal</span><strong id="sizeFrom"></strong></div>
              <span class="result-arrow" aria-hidden="true">→</span>
              <div><span class="result-label" data-i18n="cmpNew">Saiz baharu</span><strong id="sizeTo"></strong></div>
              <span class="result-pct" id="sizePct"></span>
            </div>
            <div class="buttons">
              <button type="button" class="primary" id="savePdf" data-i18n="pdfSave">Simpan</button>
              <button type="button" id="sharePdf" data-i18n="pdfShare">Kongsi</button>
            </div>
          </div>
        </section>

        <aside class="card options" aria-labelledby="optTitle">
          <h2 id="optTitle" data-i18n="cmpLevel">Tahap</h2>
          <fieldset class="segmented small">
            <legend class="sr-title" data-i18n="cmpLevel">Tahap</legend>
            <label><input type="radio" name="level" value="light"><span data-i18n="cmpLight">Ringan</span></label>
            <label><input type="radio" name="level" value="medium" checked><span data-i18n="cmpMedium">Sederhana</span></label>
            <label><input type="radio" name="level" value="strong"><span data-i18n="cmpStrong">Kuat</span></label>
          </fieldset>
          <label class="field">
            <span data-i18n="cmpLimit">Had saiz maksimum</span>
            <select id="limit">
              <option value="0" data-i18n="cmpNoLimit">Tiada had</option>
              <option value="5242880">5 MB</option>
              <option value="2097152">2 MB</option>
              <option value="1048576">1 MB</option>
              <option value="512000">500 KB</option>
            </select>
          </label>
          <label class="check">
            <input type="checkbox" id="gray">
            <span data-i18n="cmpGray">Hitam putih (lebih kecil)</span>
          </label>
          <p class="note" data-i18n="cmpWarn"></p>
          <div class="buttons stack">
            <button type="button" class="primary" id="run" data-i18n="cmpRun">Kecilkan PDF</button>
          </div>
          <div class="progress" id="progress" hidden><span id="progressBar"></span></div>
          <p class="status" id="status" role="status" aria-live="polite"></p>
        </aside>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div>
        <a class="logo" href="../"><img src="../icons/icon.svg" alt="" width="24" height="24"><span>DokuJaga</span></a>
        <p data-i18n="footerTag">Alat dokumen yang jaga privasi anda.</p>
      </div>
      <p data-i18n="footer">Bukan laman rasmi kerajaan. Sumber terbuka (MIT).</p>
    </div>
  </footer>
</body>
</html>
