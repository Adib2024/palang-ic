<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Privacy guarantee enforced by the browser: this page cannot open any
       network connection, and loads code, styles, fonts and images only
       from this site. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'none'; font-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Nombor Muka Surat · DokuJaga</title>
  <meta name="description" content="Tambah nombor muka surat pada PDF terus dalam pelayar. Tiada apa-apa dimuat naik.">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../icons/icon-192.png">
  <link rel="preload" href="../fonts/inter-regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/theme.js"></script>
  <script type="module" src="../js/pagenum.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="logo" href="../"><img src="../icons/icon.svg" alt="" width="30" height="30"><span>DokuJaga</span></a>
      <nav class="nav-links" aria-label="Utama">
        <a href="../#tools" data-i18n="navTools">Alat</a>
        <a href="../#privacy" data-i18n="navPrivacy">Privasi</a>
      </nav>
      <div class="top-actions">
        <button type="button" class="theme-toggle" id="themeToggle" aria-pressed="false"
                data-i18n-attr="aria-label:themeToggle,title:themeToggle" aria-label="Tukar tema cerah/gelap">&#9790;</button>
        <div class="lang" role="group" aria-label="Bahasa / Language">
          <button type="button" data-lang="ms" aria-pressed="true">BM</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </div>
  </header>

  <section class="hero tool-hero tone-violet">
    <div class="container">
      <p class="crumbs"><a href="../" data-i18n="allTools">Semua alat</a> /</p>
      <span class="tool-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 8h6M8 11h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M10.5 15.5 12 14.5V19m-1.5 0h3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <h1 data-i18n="toolPnTitle">Nombor Muka Surat</h1>
      <p class="lead" data-i18n="pnLead"></p>
    </div>
  </section>

  <main class="page">
    <div class="container stack">
      <section class="privacy">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5l-8-3Zm-1 14-4-4 1.4-1.4L11 13.2l4.6-4.6L17 10l-6 6Z"/></svg>
        <strong data-i18n="privacyFiles">Fail anda diproses dalam peranti anda sahaja. Tiada apa-apa dimuat naik.</strong>
      </section>

      <div class="tool-layout tone-violet is-empty" id="toolLayout">
        <section class="card">
          <div class="dropzone" id="dropzone">
            <svg aria-hidden="true" viewBox="0 0 24 24" width="44" height="44"><path d="M12 15.5V4m-4.5 4.5L12 4l4.5 4.5M4 15v3.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <p><strong data-i18n="pdfDropBig"></strong></p>
            <p class="drop-or" data-i18n="i2pOr">atau</p>
            <div class="drop-buttons">
              <label class="btn primary lg">
                <input type="file" id="pickFiles" accept="application/pdf,.pdf">
                <span data-i18n="pdfChoose"></span>
              </label>
            </div>
          </div>
          <div class="file-card after-load">
            <div class="file-info">
              <h2 id="docTitle" class="file-name"></h2>
              <p class="file-meta" id="docMeta"></p>
              <button type="button" class="link" id="another" data-i18n="cmpAnother">Pilih PDF lain</button>
            </div>
          </div>
          <div class="preview-wrap after-load" id="previewWrap">
            <canvas id="preview" class="pdf-preview"></canvas>
            <p class="preview-cap" data-i18n="preview">Pratonton</p>
          </div>
        </section>

        <aside class="card options" aria-labelledby="optTitle">
          <h2 id="optTitle" data-i18n="toolPnTitle">Nombor Muka Surat</h2>
          <fieldset class="pos-field">
            <legend data-i18n="pnPos">Kedudukan</legend>
            <div class="pos-grid six" id="pnPosGrid"><label><input type="radio" name="pnPos" value="tl"><span aria-label="tl">◤</span></label><label><input type="radio" name="pnPos" value="tc"><span aria-label="tc">▲</span></label><label><input type="radio" name="pnPos" value="tr"><span aria-label="tr">◥</span></label><label><input type="radio" name="pnPos" value="bl"><span aria-label="bl">◣</span></label><label><input type="radio" name="pnPos" value="bc" checked><span aria-label="bc">▼</span></label><label><input type="radio" name="pnPos" value="br"><span aria-label="br">◢</span></label></div>
          </fieldset>
          <label class="field">
            <span data-i18n="pnFormat">Format</span>
            <select id="pnFormat">
              <option value="n">1</option>
              <option value="nOfTotal">1 / 10</option>
              <option value="words">Muka surat 1 daripada 10</option>
            </select>
          </label>
          <label class="field">
            <span data-i18n="pnStart">Mula dari nombor</span>
            <input type="number" id="pnStart" min="0" step="1" value="1" inputmode="numeric">
          </label>
          <label class="check"><input type="checkbox" id="pnSkip"><span data-i18n="pnSkip">Langkau muka surat pertama</span></label>
          <label class="range"><span data-i18n="pnSize">Saiz tulisan</span>
            <input type="range" id="pnSize" min="7" max="24" step="1"><output id="sizeOut"></output></label>
          <fieldset class="segmented small">
            <legend data-i18n="pnMargin">Margin</legend>
            <label><input type="radio" name="pnMargin" value="small"><span data-i18n="i2pSmall">Kecil</span></label>
            <label><input type="radio" name="pnMargin" value="mid" checked><span data-i18n="mid">Sederhana</span></label>
            <label><input type="radio" name="pnMargin" value="large"><span data-i18n="i2pLarge">Besar</span></label>
          </fieldset>
          <label class="field">
            <span data-i18n="i2pFileName">Nama fail</span>
            <input type="text" id="fileName" maxlength="60" autocomplete="off">
          </label>
          <div class="buttons stack">
            <button type="button" class="primary" id="savePdf" data-i18n="pdfSave">Simpan</button>
            <button type="button" id="sharePdf" data-i18n="pdfShare">Kongsi</button>
          </div>
          <p class="status" id="status" role="status" aria-live="polite"></p>
        </aside>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div>
        <a class="logo" href="../"><img src="../icons/icon.svg" alt="" width="24" height="24"><span>DokuJaga</span></a>
        <p data-i18n="footerTag">Alat dokumen yang jaga privasi anda.</p>
      </div>
      <p data-i18n="footer">Bukan laman rasmi kerajaan. Sumber terbuka (MIT).</p>
    </div>
  </footer>
</body>
</html>
