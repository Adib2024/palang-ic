<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Privacy guarantee enforced by the browser: this page cannot open any
       network connection, and loads code, styles, fonts and images only
       from this site. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'none'; font-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Edit PDF · DokuJaga</title>
  <meta name="description" content="Tambah teks, gambar, bentuk dan lukisan pada PDF terus dalam pelayar. Tiada apa-apa dimuat naik.">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../icons/icon-192.png">
  <link rel="preload" href="../fonts/inter-regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/theme.js"></script>
  <script type="module" src="../js/edit.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="logo" href="../"><img src="../icons/icon.svg" alt="" width="30" height="30"><span>DokuJaga</span></a>
      <nav class="nav-links" aria-label="Utama">
        <a href="../#tools" data-i18n="navTools">Alat</a>
        <a href="../#privacy" data-i18n="navPrivacy">Privasi</a>
      </nav>
      <div class="top-actions">
        <a class="adv-link" href="../aliran-kerja/" data-i18n-attr="title:navAdvanced" title="Mod Lanjutan"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="6" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="14" y="15" width="7" height="6" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M6.5 9v3.5a2 2 0 0 0 2 2H14m-2.5-2.5L14 14.5 11.5 17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M17.5 5h2.5M17.5 8h2.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span data-i18n="navAdvanced">Mod Lanjutan</span></a>
        <button type="button" class="theme-toggle" id="themeToggle" aria-pressed="false"
                data-i18n-attr="aria-label:themeToggle,title:themeToggle" aria-label="Tukar tema cerah/gelap">&#9790;</button>
        <div class="lang" role="group" aria-label="Bahasa / Language">
          <button type="button" data-lang="ms" aria-pressed="true">BM</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </div>
  </header>

  <section class="hero tool-hero tone-violet">
    <div class="container">
      <p class="crumbs"><a href="../" data-i18n="allTools">Semua alat</a> /</p>
      <span class="tool-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M11 21H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M8 8h5M8 11h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="m18.5 12.5 2 2-6.5 6.5H12v-2Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></span>
      <h1 data-i18n="toolEditTitle">Edit PDF</h1>
      <p class="lead" data-i18n="editLead"></p>
    </div>
  </section>

  <main class="page">
    <div class="container stack">
      <section class="privacy">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5l-8-3Zm-1 14-4-4 1.4-1.4L11 13.2l4.6-4.6L17 10l-6 6Z"/></svg>
        <strong data-i18n="privacyFiles">Fail anda diproses dalam peranti anda sahaja. Tiada apa-apa dimuat naik.</strong>
      </section>

      <div class="tool-layout sign-layout tone-violet is-empty" id="toolLayout">
        <section class="card">
          <div class="dropzone" id="dropzone">
            <svg aria-hidden="true" viewBox="0 0 24 24" width="44" height="44"><path d="M12 15.5V4m-4.5 4.5L12 4l4.5 4.5M4 15v3.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <p><strong data-i18n="pdfDropBig"></strong></p>
            <p class="drop-or" data-i18n="i2pOr">atau</p>
            <div class="drop-buttons">
              <label class="btn primary lg">
                <input type="file" id="pickFiles" accept="application/pdf,.pdf">
                <span data-i18n="pdfChoose"></span>
              </label>
            </div>
          </div>
          <div class="file-card after-load">
            <div class="file-info">
              <h2 id="docTitle" class="file-name"></h2>
              <p class="file-meta" id="docMeta"></p>
              <button type="button" class="link" id="another" data-i18n="cmpAnother">Pilih PDF lain</button>
            </div>
          </div>
          <div class="edit-toolbar after-load" role="toolbar" aria-label="Alat">
            <button type="button" class="tool-btn" data-tool="select" aria-pressed="false"><span aria-hidden="true">↖</span><span data-i18n="editSelect"></span></button>
            <button type="button" class="tool-btn" data-tool="text" aria-pressed="false"><span aria-hidden="true">T</span><span data-i18n="editText"></span></button>
            <button type="button" class="tool-btn" data-tool="image" aria-pressed="false"><span aria-hidden="true">🖼</span><span data-i18n="editImage"></span></button>
            <button type="button" class="tool-btn" data-tool="rect" aria-pressed="false"><span aria-hidden="true">▭</span><span data-i18n="editRect"></span></button>
            <button type="button" class="tool-btn" data-tool="ellipse" aria-pressed="false"><span aria-hidden="true">◯</span><span data-i18n="editEllipse"></span></button>
            <button type="button" class="tool-btn" data-tool="line" aria-pressed="false"><span aria-hidden="true">╱</span><span data-i18n="editLine"></span></button>
            <button type="button" class="tool-btn" data-tool="pen" aria-pressed="false"><span aria-hidden="true">✎</span><span data-i18n="editPen"></span></button>
            <button type="button" class="tool-btn" data-tool="highlight" aria-pressed="false"><span aria-hidden="true">▬</span><span data-i18n="editHighlight"></span></button>
            <span class="tb-sep"></span>
            <button type="button" class="tool-btn" id="undoBtn"><span aria-hidden="true">↶</span><span data-i18n="editUndo"></span></button>
            <button type="button" class="tool-btn" id="deleteBtn"><span aria-hidden="true">🗑</span><span data-i18n="editDelete"></span></button>
          </div>
          <input type="file" id="imageFile" accept="image/*" hidden>
          <p class="hint-top" data-i18n="editHint"></p>
          <div class="sign-pages" id="editPages"></div>
        </section>

        <aside class="card options sign-panel" aria-labelledby="optTitle">
          <h2 id="optTitle" data-i18n="toolEditTitle">Edit PDF</h2>
          <fieldset class="swatches">
            <legend data-i18n="color">Warna</legend>
            <label class="sw sw-black"><input type="radio" name="editColor" value="black" checked><span data-i18n="black">Hitam</span></label>
            <label class="sw sw-red"><input type="radio" name="editColor" value="red"><span data-i18n="red">Merah</span></label>
            <label class="sw sw-blue"><input type="radio" name="editColor" value="blue"><span data-i18n="blue">Biru</span></label>
            <label class="sw sw-green"><input type="radio" name="editColor" value="green"><span data-i18n="green">Hijau</span></label>
          </fieldset>
          <label class="range"><span data-i18n="editFont">Saiz teks</span>
            <input type="range" id="fontSize" min="8" max="48" step="1" value="14"><output id="fontOut"></output></label>
          <label class="range"><span data-i18n="editStroke">Tebal garis</span>
            <input type="range" id="stroke" min="1" max="12" step="1" value="3"><output id="strokeOut"></output></label>
          <div class="divider"></div>
          <label class="field">
            <span data-i18n="i2pFileName">Nama fail</span>
            <input type="text" id="fileName" maxlength="60" autocomplete="off">
          </label>
          <div class="buttons stack">
            <button type="button" class="primary" id="savePdf" data-i18n="pdfSave">Simpan</button>
            <button type="button" id="sharePdf" data-i18n="pdfShare">Kongsi</button>
          </div>
          <p class="status" id="status" role="status" aria-live="polite"></p>
        </aside>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div>
        <a class="logo" href="../"><img src="../icons/icon.svg" alt="" width="24" height="24"><span>DokuJaga</span></a>
        <p data-i18n="footerTag">Alat dokumen yang jaga privasi anda.</p>
      </div>
      <p data-i18n="footer">Bukan laman rasmi kerajaan. Sumber terbuka (MIT).</p>
    </div>
  </footer>
</body>
</html>
