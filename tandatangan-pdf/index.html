<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Privacy guarantee enforced by the browser: this page cannot open any
       network connection, and loads code, styles, fonts and images only
       from this site. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'none'; font-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Tandatangan PDF · DokuJaga</title>
  <meta name="description" content="Tandatangan PDF terus dalam pelayar: lukis, taip atau muat naik tandatangan. Tiada apa-apa dimuat naik.">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../icons/icon-192.png">
  <link rel="preload" href="../fonts/inter-regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/theme.js"></script>
  <script type="module" src="../js/sign.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="logo" href="../"><img src="../icons/icon.svg" alt="" width="30" height="30"><span>DokuJaga</span></a>
      <nav class="nav-links" aria-label="Utama">
        <a href="../#tools" data-i18n="navTools">Alat</a>
        <a href="../#privacy" data-i18n="navPrivacy">Privasi</a>
      </nav>
      <div class="top-actions">
        <button type="button" class="theme-toggle" id="themeToggle" aria-pressed="false"
                data-i18n-attr="aria-label:themeToggle,title:themeToggle" aria-label="Tukar tema cerah/gelap">&#9790;</button>
        <div class="lang" role="group" aria-label="Bahasa / Language">
          <button type="button" data-lang="ms" aria-pressed="true">BM</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </div>
  </header>

  <section class="hero tool-hero tone-violet">
    <div class="container">
      <p class="crumbs"><a href="../" data-i18n="allTools">Semua alat</a> /</p>
      <span class="tool-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 17.5c2.5-.5 3.5-6 5.5-6 1.6 0 .4 5 2 5 1.3 0 2-2.6 3.2-2.6.9 0 .9 1.6 2.1 1.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 21h18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="m15.5 4.5 4 4L12 16l-4.5.5L8 12Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></span>
      <h1 data-i18n="toolSignTitle">Tandatangan PDF</h1>
      <p class="lead" data-i18n="sigLead"></p>
    </div>
  </section>

  <main class="page">
    <div class="container stack">
      <section class="privacy">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5l-8-3Zm-1 14-4-4 1.4-1.4L11 13.2l4.6-4.6L17 10l-6 6Z"/></svg>
        <strong data-i18n="privacyFiles">Fail anda diproses dalam peranti anda sahaja. Tiada apa-apa dimuat naik.</strong>
      </section>

      <div class="tool-layout sign-layout tone-violet is-empty" id="toolLayout">
        <section class="card" aria-labelledby="docTitle">
          <div class="dropzone" id="dropzone">
            <svg aria-hidden="true" viewBox="0 0 24 24" width="44" height="44"><path d="M12 15.5V4m-4.5 4.5L12 4l4.5 4.5M4 15v3.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <p><strong data-i18n="pdfDropBig"></strong></p>
            <p class="drop-or" data-i18n="i2pOr">atau</p>
            <div class="drop-buttons">
              <label class="btn primary lg">
                <input type="file" id="pickFiles" accept="application/pdf,.pdf">
                <span data-i18n="pdfChoose"></span>
              </label>
            </div>
          </div>

          <div class="file-card" id="fileCard" hidden>
            <div class="file-info">
              <h2 id="docTitle" class="file-name"></h2>
              <p class="file-meta"><span id="fileMeta"></span> · <strong id="activeLabel"></strong></p>
              <button type="button" class="link" id="another" data-i18n="cmpAnother">Pilih PDF lain</button>
            </div>
          </div>
          <div class="sign-pages" id="signPages"></div>
        </section>

        <aside class="card options sign-panel" aria-labelledby="sigTitle">
          <h2 id="sigTitle" data-i18n="sigYours">Tandatangan anda</h2>
          <fieldset class="segmented small">
            <legend class="sr-title" data-i18n="sigYours">Tandatangan anda</legend>
            <label><input type="radio" name="sigTab" value="draw" checked><span data-i18n="sigDraw">Lukis</span></label>
            <label><input type="radio" name="sigTab" value="type"><span data-i18n="sigType">Taip</span></label>
            <label><input type="radio" name="sigTab" value="image"><span data-i18n="sigImage">Gambar</span></label>
          </fieldset>

          <div data-tab="draw">
            <canvas class="sig-pad" id="pad" width="900" height="360"></canvas>
            <div class="pad-tools">
              <fieldset class="ink">
                <legend class="sr-title" data-i18n="sigPen">Warna dakwat</legend>
                <label class="ink-black"><input type="radio" name="ink" value="#111111" checked><span data-i18n-attr="aria-label:black,title:black" aria-label="Hitam"></span></label>
                <label class="ink-blue"><input type="radio" name="ink" value="#1d3a8a"><span data-i18n-attr="aria-label:blue,title:blue" aria-label="Biru"></span></label>
              </fieldset>
              <button type="button" class="link" id="padClear" data-i18n="sigClear">Kosongkan</button>
            </div>
          </div>

          <div data-tab="type" hidden>
            <label class="field">
              <span class="sr-title" data-i18n="sigNamePh">Nama</span>
              <input type="text" id="typedName" maxlength="60" autocomplete="name" data-i18n-attr="placeholder:sigNamePh" placeholder="Nama penuh anda">
            </label>
            <fieldset class="segmented small">
              <legend data-i18n="sigStyle">Gaya</legend>
              <label><input type="radio" name="typeStyle" value="0" checked><span class="sig-font-0">Aa</span></label>
              <label><input type="radio" name="typeStyle" value="1"><span class="sig-font-1">Aa</span></label>
              <label><input type="radio" name="typeStyle" value="2"><span class="sig-font-2">Aa</span></label>
            </fieldset>
            <canvas class="sig-pad preview" id="typedPreview" width="900" height="300"></canvas>
          </div>

          <div data-tab="image" hidden>
            <label class="btn">
              <input type="file" id="sigFile" accept="image/*">
              <span data-i18n="sigUpload">Pilih gambar tandatangan</span>
            </label>
            <label class="check">
              <input type="checkbox" id="removeBg" checked>
              <span data-i18n="sigRemoveBg">Buang latar putih</span>
            </label>
            <canvas class="sig-pad preview" id="imagePreview" width="900" height="360"></canvas>
          </div>

          <div class="buttons stack">
            <button type="button" class="primary" id="addSig" data-i18n="sigAdd">Letak tandatangan</button>
          </div>

          <div class="sign-text">
            <div class="field-row">
              <label class="field">
                <span data-i18n="sigDate">Tarikh</span>
                <input type="date" id="dateValue">
              </label>
              <button type="button" class="btn" id="addDate" data-i18n="sigAddDate">Letak tarikh</button>
            </div>
            <div class="field-row">
              <label class="field">
                <span data-i18n="sigText">Teks</span>
                <input type="text" id="extraText" maxlength="80" autocomplete="off" data-i18n-attr="placeholder:sigTextPh" placeholder="cth. nama, No. IC, jawatan">
              </label>
              <button type="button" class="btn" id="addText" data-i18n="sigAddText">Letak teks</button>
            </div>
            <label class="check">
              <input type="checkbox" id="allPages">
              <span data-i18n="sigAllPages">Letak pada semua muka surat</span>
            </label>
          </div>
          <p class="hint" data-i18n="sigHint"></p>

          <label class="field">
            <span data-i18n="i2pFileName">Nama fail</span>
            <input type="text" id="fileName" maxlength="60" autocomplete="off">
          </label>
          <div class="buttons">
            <button type="button" class="primary" id="savePdf" data-i18n="pdfSave">Simpan</button>
            <button type="button" id="sharePdf" data-i18n="pdfShare">Kongsi</button>
          </div>
          <p class="status" id="status" role="status" aria-live="polite"></p>
          <p class="hint" data-i18n="sigNote"></p>
        </aside>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div>
        <a class="logo" href="../"><img src="../icons/icon.svg" alt="" width="24" height="24"><span>DokuJaga</span></a>
        <p data-i18n="footerTag">Alat dokumen yang jaga privasi anda.</p>
      </div>
      <p data-i18n="footer">Bukan laman rasmi kerajaan. Sumber terbuka (MIT).</p>
    </div>
  </footer>
</body>
</html>
