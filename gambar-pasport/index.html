<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Privacy guarantee enforced by the browser: this page cannot open any
       network connection, and loads code, styles, fonts and images only
       from this site. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'none'; font-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Gambar Pasport · DokuJaga</title>
  <meta name="description" content="Potong gambar pasport atau profil ikut saiz (35×50 mm, 35×45 mm) dan cetak beberapa keping pada 4R atau A4. Tiada apa-apa dimuat naik.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="DokuJaga">
  <meta property="og:title" content="Gambar Pasport · DokuJaga">
  <meta property="og:description" content="Potong gambar pasport atau profil ikut saiz (35×50 mm, 35×45 mm) dan cetak beberapa keping pada 4R atau A4. Tiada apa-apa dimuat naik.">
  <meta property="og:image" content="https://adib2024.github.io/palang-ic/icons/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../icons/icon-192.png">
  <link rel="preload" href="../fonts/inter-regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/theme.js"></script>
  <script type="module" src="../js/passport.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="logo" href="../"><img src="../icons/icon.svg" alt="" width="30" height="30"><span>DokuJaga</span></a>
      <nav class="nav-links" aria-label="Utama">
        <a href="../#tools" data-i18n="navTools">Alat</a>
        <a href="../#privacy" data-i18n="navPrivacy">Privasi</a>
      </nav>
      <div class="top-actions">
        <a class="adv-link" href="../aliran-kerja/" data-i18n-attr="title:navAdvanced" title="Mod Lanjutan"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="6" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="14" y="15" width="7" height="6" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M6.5 9v3.5a2 2 0 0 0 2 2H14m-2.5-2.5L14 14.5 11.5 17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M17.5 5h2.5M17.5 8h2.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span data-i18n="navAdvanced">Mod Lanjutan</span></a>
        <button type="button" class="theme-toggle" id="themeToggle" aria-pressed="false"
                data-i18n-attr="aria-label:themeToggle,title:themeToggle" aria-label="Tukar tema cerah/gelap">&#9790;</button>
        <div class="lang" role="group" aria-label="Bahasa / Language">
          <button type="button" data-lang="ms" aria-pressed="true">BM</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </div>
  </header>

  <section class="hero tool-hero tone-sky">
    <div class="container">
      <p class="crumbs"><a href="../" data-i18n="allTools">Semua alat</a> /</p>
      <span class="tool-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="2.5" width="14" height="19" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="10" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M7.5 18.5c.8-2.6 2.5-3.8 4.5-3.8s3.7 1.2 4.5 3.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span>
      <h1 data-i18n="toolPassportTitle">Gambar Pasport</h1>
      <p class="lead" data-i18n="ppLead"></p>
    </div>
  </section>

  <main class="page">
    <div class="container stack">
      <section class="privacy">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5l-8-3Zm-1 14-4-4 1.4-1.4L11 13.2l4.6-4.6L17 10l-6 6Z"/></svg>
        <strong data-i18n="privacyFiles">Fail anda diproses dalam peranti anda sahaja. Tiada apa-apa dimuat naik.</strong>
      </section>

      <div class="tool-layout tone-sky is-empty" id="toolLayout">
        <section class="card" aria-labelledby="docTitle">
          <div class="dropzone" id="dropzone">
            <svg aria-hidden="true" viewBox="0 0 24 24" width="44" height="44"><path d="M12 15.5V4m-4.5 4.5L12 4l4.5 4.5M4 15v3.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <p><strong data-i18n="ppDropBig"></strong></p>
            <p class="drop-or" data-i18n="i2pOr">atau</p>
            <div class="drop-buttons">
              <label class="btn primary lg">
                <input type="file" id="pickFiles" accept="image/*,.heic,.heif">
                <span data-i18n="ppChoose"></span>
              </label>
              <label class="btn lg camera-only">
                <input type="file" id="pickCamera" accept="image/*,.heic,.heif" capture="environment">
                <span data-i18n="i2pCamera">Ambil gambar</span>
              </label>
            </div>
          </div>
          <div class="file-card after-load">
            <div class="file-info">
              <h2 id="docTitle" class="file-name"></h2>
              <p class="file-meta" id="docMeta"></p>
              <button type="button" class="link" id="another" data-i18n="ppAnother"></button>
            </div>
          </div>
          <div class="pp-stage after-load">
            <canvas id="ppCanvas" width="600" height="857" tabindex="0" data-i18n-attr="aria-label:ppCanvasLabel"></canvas>
            <p class="hint" data-i18n="ppDragHint"></p>
          </div>
        </section>
        <aside class="card options" aria-labelledby="optTitle">
          <h2 id="optTitle" data-i18n="i2pOptions">Tetapan</h2>
          <fieldset class="segmented small">
            <legend data-i18n="ppSize">Saiz gambar</legend>
            <label><input type="radio" name="ppSize" value="my" checked><span data-i18n="ppMy">Pasport Malaysia</span></label>
            <label><input type="radio" name="ppSize" value="intl"><span>35×45 mm</span></label>
            <label><input type="radio" name="ppSize" value="custom"><span data-i18n="ppCustom">Saiz sendiri</span></label>
          </fieldset>
          <div class="field-row" id="ppCustomRow" hidden>
            <label class="field"><span data-i18n="ppWidth">Lebar (mm)</span><input type="number" id="ppW" min="15" max="100" step="1" value="40" inputmode="numeric"></label>
            <label class="field"><span data-i18n="ppHeight">Tinggi (mm)</span><input type="number" id="ppH" min="15" max="120" step="1" value="50" inputmode="numeric"></label>
          </div>
          <label class="range"><span data-i18n="ppZoom">Zum</span><output id="ppZoomOut"></output>
            <input type="range" id="ppZoom" min="100" max="400" step="5" value="100"></label>
          <label class="range"><span data-i18n="ppBright">Kecerahan</span><output id="ppBrightOut"></output>
            <input type="range" id="ppBright" min="-40" max="40" step="1" value="0"></label>
          <label class="range"><span data-i18n="ppContrast">Kontras</span><output id="ppContrastOut"></output>
            <input type="range" id="ppContrast" min="-40" max="40" step="1" value="0"></label>
          <label class="range"><span data-i18n="ppWhite">Cerahkan latar</span><output id="ppWhiteOut"></output>
            <input type="range" id="ppWhite" min="0" max="100" step="5" value="0"></label>
          <fieldset class="segmented small">
            <legend data-i18n="ppSheet">Kertas cetak</legend>
            <label><input type="radio" name="ppPaper" value="4r" checked><span data-i18n="pp4r">4R (4×6 inci)</span></label>
            <label><input type="radio" name="ppPaper" value="a4"><span>A4</span></label>
          </fieldset>
          <p class="hint" id="ppCopies"></p>
          <p class="note" data-i18n="ppTip"></p>
            <div class="buttons">
              <button type="button" class="primary" id="savePhoto" data-i18n="ppSavePhoto"></button>
              <button type="button" id="saveSheet" data-i18n="ppSaveSheet"></button>
            </div>
            <p class="status" id="status" role="status" aria-live="polite"></p>
        </aside>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div>
        <a class="logo" href="../"><img src="../icons/icon.svg" alt="" width="24" height="24"><span>DokuJaga</span></a>
        <p data-i18n="footerTag">Alat dokumen yang jaga privasi anda.</p>
      </div>
      <p class="footer-links"><a href="../privasi/" data-i18n="privacyPage">Privasi</a><a href="https://github.com/Adib2024/palang-ic" rel="noopener">GitHub</a></p>
      <p data-i18n="footer">Bukan laman rasmi kerajaan. Sumber terbuka (MIT).</p>
    </div>
  </footer>
</body>
</html>
